<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfbf8">
<title>Истори-тренажер</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<header class="top">
  <div class="brand">Истори-тренажер <span class="beta">бета</span></div>
  <div class="streak" id="streak" title="Стрик: дней подряд">🔥 0</div>
</header>

<main id="app">
  <!-- экран выбора темы -->
  <section id="screen-topics" class="screen">
    <h1>Что тренируем?</h1>
    <p class="muted">Средние века, 6 класс. Выбери параграф — поехали.</p>
    <div id="topic-list" class="cards"></div>
  </section>

  <!-- экран вопроса -->
  <section id="screen-quiz" class="screen hidden">
    <div class="progress"><div id="progress-bar"></div></div>
    <div class="character" id="character">
      <div class="char-face" id="char-face">🙂</div>
      <div class="char-say" id="char-say">Ну, покажи, что умеешь.</div>
    </div>
    <h2 id="question"></h2>
    <div id="options" class="options"></div>
    <div id="feedback" class="feedback hidden">
      <p id="feedback-text"></p>
      <button id="next-btn" class="btn primary">Дальше</button>
    </div>
  </section>

  <!-- экран итогов -->
  <section id="screen-result" class="screen hidden">
    <h1 id="result-title"></h1>
    <p id="result-text" class="muted"></p>
    <div class="row">
      <button id="again-btn" class="btn primary">Еще раз</button>
      <button id="home-btn" class="btn">К темам</button>
    </div>
  </section>
</main>

<footer class="bottom muted">Проект Дани. Персонажи и шутки — тоже его.</footer>
<script src="js/app.js"></script>
</body>
</html>
