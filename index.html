<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfbf8">
<title>Истори-тренажер</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
</head>
<body>
<header class="top">
  <button class="brand" id="brand">Истори-тренажер <span class="beta">бета</span></button>
  <div class="stats"><span id="xp" title="Опыт">⭐ 0</span> <span id="streak" title="Дней подряд">🔥 0</span></div>
</header>

<main id="app">
  <!-- Главный экран -->
  <section id="screen-home" class="screen">
    <div id="daily" class="daily hidden">
      <div><b>Микс дня</b><div class="muted small">5 заданий из того, что подзабылось</div></div>
      <button class="btn primary" id="daily-btn">Погнали</button>
    </div>
    <h1>Средние века</h1>
    <p class="muted">Выбери урок или готовься к контрольной по главе.</p>
    <div id="home-list"></div>
  </section>

  <!-- Карточки перед уроком -->
  <section id="screen-cards" class="screen hidden">
    <h2 id="cards-title"></h2>
    <p class="muted small">Нажми на карточку, чтобы перевернуть.</p>
    <div class="flip" id="flip"><div class="flip-face" id="flip-front"></div></div>
    <div class="row"><button class="btn" id="cards-prev">←</button><span id="cards-count" class="muted"></span><button class="btn" id="cards-next">→</button></div>
    <div class="row"><button class="btn primary" id="cards-start">К заданиям</button><button class="btn" id="cards-home">Назад</button></div>
  </section>

  <!-- Урок / уровень / микс -->
  <section id="screen-task" class="screen hidden">
    <div class="taskbar">
      <button class="x" id="quit" title="Выйти">✕</button>
      <div class="progress"><div id="progress-bar"></div></div>
      <div id="hearts" class="hearts hidden"></div>
    </div>
    <div class="character" id="character">
      <div class="char-face" id="char-face">🙂</div>
      <div class="char-say" id="char-say"></div>
    </div>
    <div id="task"></div>
    <div id="feedback" class="feedback hidden">
      <p id="feedback-text"></p>
      <p id="assoc" class="assoc hidden"></p>
      <div class="row">
        <button id="more-btn" class="btn small hidden">🔍 хочу все знать</button>
        <button id="next-btn" class="btn primary">Дальше</button>
      </div>
      <p id="more-text" class="more hidden"></p>
    </div>
    <div class="row"><button id="check-btn" class="btn primary hidden">Проверить</button></div>
  </section>

  <!-- Итоги -->
  <section id="screen-result" class="screen hidden">
    <div class="char-face big" id="result-face">🎉</div>
    <h1 id="result-title"></h1>
    <p id="result-text" class="muted"></p>
    <p id="result-xp" class="xpgain"></p>
    <div class="row">
      <button id="again-btn" class="btn primary">Еще раз</button>
      <button id="home-btn" class="btn">На главную</button>
    </div>
  </section>
</main>

<footer class="bottom muted">Проект Дани. Персонажи и шутки — тоже его.</footer>
<script src="js/app.js"></script>
</body>
</html>
